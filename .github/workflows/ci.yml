# CI pipeline from TDD B14.
#   Every push and PR: format check, lint, type check, unit tests, rojo build.
#   Push to main: also publish the build to the Test place.
#   Tag like v1.2.0: publish the build to the Prod place.
# The publish steps skip themselves until the Open Cloud secrets and place
# variables exist (see README > CI and publishing).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install packages
        run: wally install

      - name: Check formatting
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Type check (strict Luau)
        run: |
          rojo sourcemap default.project.json --output sourcemap.json
          curl -sSfL -o globalTypes.d.luau \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          luau-lsp analyze \
            --definitions=@roblox=globalTypes.d.luau \
            --sourcemap=sourcemap.json \
            --ignore="Packages/**" \
            --ignore="ServerPackages/**" \
            src

      - name: Unit tests (pure logic, run with Lune)
        run: lune run tests/run.luau

      - name: Build place
        run: rojo build default.project.json --output SwordSwingSim.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: SwordSwingSim.rbxl
          path: SwordSwingSim.rbxl

  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      # main publishes to Test; a v* tag publishes to Prod.
      UNIVERSE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_UNIVERSE_ID || vars.TEST_UNIVERSE_ID }}
      PLACE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PROD_PLACE_ID || vars.TEST_PLACE_ID }}
    steps:
      - name: Download place file
        uses: actions/download-artifact@v4
        with:
          name: SwordSwingSim.rbxl

      - name: Publish with Open Cloud
        if: env.ROBLOX_API_KEY != '' && env.UNIVERSE_ID != '' && env.PLACE_ID != ''
        run: |
          curl -sSf -X POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @SwordSwingSim.rbxl

      - name: Note skipped publish
        if: env.ROBLOX_API_KEY == '' || env.UNIVERSE_ID == '' || env.PLACE_ID == ''
        run: echo "Publish skipped; set ROBLOX_API_KEY and the place variables to enable it."
